name: Sync Stars
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [notes.json, config.json, sync_stars.py, summarize_stars.py, test_sync.py, .github/workflows/sync.yml]
permissions:
  contents: read
concurrency:
  group: star-library
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test
        run: python3 -m unittest -bv
      - name: Sync public stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sync_stars.py
      - name: Summarize new public READMEs
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python3 summarize_stars.py
      - name: Transfer synchronized records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synced-stars
          path: stars.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  publish:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: synced-stars
          path: ${{ runner.temp }}/momo-sync
      - name: Render synchronized records
        run: |
          cp "$RUNNER_TEMP/momo-sync/stars.json" stars.json
          python3 sync_stars.py --render-only
      - name: Save generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json INBOX.md INDEX.md search.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync starred repositories"
            git push origin HEAD:main
          fi
      - name: Package search page only
        run: |
          mkdir -p _site
          cp search.html _site/index.html
          test "$(find _site -type f | wc -l)" -eq 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
