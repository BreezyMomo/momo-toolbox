name: Sync Stars
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [notes.json, config.json, sync_stars.py, test_sync.py, .github/workflows/sync.yml]
permissions:
  contents: read
concurrency:
  group: star-library
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test
        run: python3 -m unittest -v
      - name: Sync public stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sync_stars.py
      - name: Save generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json INBOX.md INDEX.md search.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync starred repositories"
            git push origin HEAD:main
          fi
      - name: Package search page only
        run: |
          mkdir -p _site
          cp search.html _site/index.html
          test "$(find _site -type f | wc -l)" -eq 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
